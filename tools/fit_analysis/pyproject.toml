[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marathoncoach-fit-analysis"
version = "0.1.0"
description = "Deterministic FIT analysis CLI for MarathonCoach custom delivery"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "PyYAML>=6,<7",
  "garmin-fit-sdk>=21.200.0,<22",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
