version: rules_v1

race_profile:
  short_distance_max_km: 10.5
  half_distance_km: 21.0975
  half_tolerance_km: 0.25
  phase_progress:
    S1_end: 0.24
    S2_end: 0.59
    S3_end: 0.83
    S4_end: 0.95

baseline:
  heart_rate_bounds:
    min_bpm: 30
    max_bpm: 260
  min_plausible_maxhr_above_lthr_bpm: 5
  ratios:
    lthr:
      FULL: [0.95, 0.96, 0.97, 0.98, 0.99]
      HALF: [0.97, 0.98, 0.99, 1.0, 1.01]
      SHORT: [0.99, 1.0, 1.01, 1.02, 1.03]
    hrr:
      FULL: [0.78, 0.8, 0.82, 0.84, 0.86]
      HALF: [0.83, 0.85, 0.87, 0.89, 0.9]
      SHORT: [0.88, 0.89, 0.9, 0.91, 0.92]
    maxhr:
      FULL: [0.84, 0.85, 0.86, 0.87, 0.88]
      HALF: [0.88, 0.89, 0.9, 0.91, 0.92]
      SHORT: [0.9, 0.91, 0.92, 0.93, 0.94]
  clipping:
    FULL:
      lthr_plus: 1
      maxhr_minus: 3
    HALF:
      lthr_plus: 3
      maxhr_minus: 2
    SHORT:
      maxhr_minus: 1

quality_gate:
  stop_speed_mps: 0.8
  gps_jump_speed_mps: 8.5
  pace_outlier_min_sec_per_km: 150
  pace_outlier_max_sec_per_km: 720
  min_interval_sec: 0.5
  usable:
    min_distance_ratio: 0.94
    max_stop_ratio: 0.03
    max_hr_missing_ratio: 0.05
    max_gps_jump_ratio: 0.01
    max_pace_outlier_ratio: 0.02
  caution:
    min_distance_ratio: 0.75
    max_stop_ratio: 0.08
    max_hr_missing_ratio: 0.15
    max_gps_jump_ratio: 0.03
    max_pace_outlier_ratio: 0.08

adjustments:
  early_restraint:
    label: 前半抑制ルール
    min_conditions: 2
    thresholds:
      s1_hr_over_cap_bpm: 2
      s2_hr_over_cap_bpm: 2
      early_pace_faster_than_goal_sec: 8
      pace_drop_35_plus_sec: 15
    deltas:
      S1: -3
      S2: -3
  mid_stabilize:
    label: 中盤安定化ルール
    min_conditions: 2
    thresholds:
      hr_rise_25_35_vs_s2_bpm: 6
      pace_25_35_slower_than_goal_sec: 8
      s3_pace_variability_sec: 15
    deltas:
      S3: -2
  late_fade_protection:
    label: 終盤失速対策ルール
    min_conditions: 1
    thresholds:
      pace_drop_35_plus_sec: 18
      hr_35_plus_over_s4_cap_bpm: 3
    deltas:
      S4: -2
      S5: -2
  late_reserve_boost:
    label: 終盤余力ルール
    min_conditions: 2
    thresholds:
      max_pace_drop_35_plus_sec: 6
      finish_kick_gain_sec: 3
      s5_hr_room_bpm: 2
    deltas:
      S5: 1

hearing_adjustments:
  heat_guard:
    label: 暑熱保守補正
    accepted_values: [high, severe]
    deltas:
      S1: -1
      S2: -1
      S3: -1
      S4: -1
      S5: -1
  fueling_guard:
    label: 補給不安補正
    accepted_values: [late, insufficient, missed]
    deltas:
      S4: -1
      S5: -1
  stomach_guard:
    label: 胃腸トラブル補正
    deltas:
      S3: -1
      S4: -1
      S5: -1
  cramp_guard:
    label: けいれん保守補正
    deltas:
      S4: -1
      S5: -1

summary_rules:
  fast_start_sec: -8
  controlled_start_sec: 6
  stable_variability_sec: 10
  unstable_variability_sec: 18
  mid_drop_sec: 10
  severe_drop_sec: 20
  hr_rise_mild_bpm: 4
  hr_rise_high_bpm: 8
  reserve_room_bpm: 2
  finish_gain_sec: 3
